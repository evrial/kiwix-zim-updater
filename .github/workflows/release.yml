name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. TEST & LINT (Runs on PRs and Branch Pushes)
  # -------------------------------------------------------------
  test:
    name: Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Tests
        run: go test -v ./...

  # -------------------------------------------------------------
  # 2. CROSS-PLATFORM BUILD & RELEASE (Runs only on tags like v1.0.0)
  # -------------------------------------------------------------
  release:
    name: Build Multi-Platform Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_name: kiwix-zim-updater-linux-amd64
          - goos: linux
            goarch: arm64
            artifact_name: kiwix-zim-updater-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact_name: kiwix-zim-updater-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact_name: kiwix-zim-updater-darwin-arm64
          - goos: windows
            goarch: amd64
            artifact_name: kiwix-zim-updater-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o dist/${{ matrix.artifact_name }} .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  # -------------------------------------------------------------
  # 3. PUBLISH GITHUB RELEASE
  # -------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifact Directory Structure
        run: |
          mkdir release_dist
          find artifacts -type f -exec cp {} release_dist/ \;
          ls -la release_dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}